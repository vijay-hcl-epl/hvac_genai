name: Build trace inputs bundle

on:
  push:
    paths:
      - "sys-reqs/sys-reqs.txt"
      - "sw-reqs/sw-reqs.txt"
      - "sw-arch/sw-arch.txt"
      - "sw-lld/sw-lld.txt"
      - "codegen/code_bundle.txt"
      - "ut-plan/ut-plan.txt"
      - "st-plan/st-plan.txt"
      - ".github/workflows/build-trace-inputs.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-trace-inputs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (same branch)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Generate trace/trace-inputs.txt
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p trace
          OUT="trace/trace-inputs.txt"

          # List of input artifacts (paths relative to repo root)
          FILES=(
            "sys-reqs/sys-reqs.txt"
            "sw-reqs/sw-reqs.txt"
            "sw-arch/sw-arch.txt"
            "sw-lld/sw-lld.txt"
            "codegen/code_bundle.txt"
            "ut-plan/ut-plan.txt"
            "st-plan/st-plan.txt"
          )

          {
            echo "TRACE INPUTS BUNDLE"
            echo "Generated by GitHub Actions"
            echo "Branch: ${GITHUB_REF_NAME}"
            echo "Commit: ${GITHUB_SHA}"
            echo "Timestamp (UTC): $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo
            for f in "${FILES[@]}"; do
              echo "===== START ${f} ====="
              if [ -f "$f" ]; then
                cat "$f"
              else
                echo "<<< MISSING FILE: ${f} >>>"
              fi
              echo
              echo "===== END ${f} ====="
              echo
            done
          } > "$OUT"

      - name: Commit & push trace/trace-inputs.txt if changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add trace/trace-inputs.txt

          if git diff --cached --quiet; then
            echo "No changes to trace/trace-inputs.txt"
            exit 0
          fi

          # Prevent infinite CI loops by skipping CI on this commit
          git commit -m "Build trace inputs bundle [skip ci]"
          git push
