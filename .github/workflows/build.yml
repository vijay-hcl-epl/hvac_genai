name: Build STM32 Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ARM GNU Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi

      - name: Verify ARM GCC
        run: |
          arm-none-eabi-gcc --version
          arm-none-eabi-size --version

      - name: Prepare build directories
        run: |
          mkdir -p build/obj/code/src
          mkdir -p build/obj/firmware/Core/Src
          mkdir -p build/obj/firmware/Core/Startup
          mkdir -p build/obj/firmware/Drivers/STM32F4xx_HAL_Driver/Src

      - name: Compile AIForce generated application
        run: |
          set -e

          for src in code/src/*.c; do
            name=$(basename "$src" .c)

            arm-none-eabi-gcc "$src" \
              -mcpu=cortex-m4 \
              -std=gnu11 \
              -g3 \
              -DDEBUG \
              -DUSE_HAL_DRIVER \
              -DSTM32F407xx \
              -Icode/inc \
              -Ifirmware/Core/Inc \
              -Ifirmware/Drivers/STM32F4xx_HAL_Driver/Inc \
              -Ifirmware/Drivers/STM32F4xx_HAL_Driver/Inc/Legacy \
              -Ifirmware/Drivers/CMSIS/Device/ST/STM32F4xx/Include \
              -Ifirmware/Drivers/CMSIS/Include \
              -O0 \
              -ffunction-sections \
              -fdata-sections \
              -Wall \
              -MMD \
              -MP \
              --specs=nano.specs \
              -mfpu=fpv4-sp-d16 \
              -mfloat-abi=hard \
              -mthumb \
              -c \
              -o "build/obj/code/src/${name}.o"
          done

      - name: Compile fixed STM32 platform sources
        run: |
          set -e

          for src in \
            firmware/Core/Src/stm32f4xx_hal_msp.c \
            firmware/Core/Src/syscalls.c \
            firmware/Core/Src/sysmem.c \
            firmware/Core/Src/system_stm32f4xx.c
          do
            name=$(basename "$src" .c)

            arm-none-eabi-gcc "$src" \
              -mcpu=cortex-m4 \
              -std=gnu11 \
              -g3 \
              -DDEBUG \
              -DUSE_HAL_DRIVER \
              -DSTM32F407xx \
              -Icode/inc \
              -Ifirmware/Core/Inc \
              -Ifirmware/Drivers/STM32F4xx_HAL_Driver/Inc \
              -Ifirmware/Drivers/STM32F4xx_HAL_Driver/Inc/Legacy \
              -Ifirmware/Drivers/CMSIS/Device/ST/STM32F4xx/Include \
              -Ifirmware/Drivers/CMSIS/Include \
              -O0 \
              -ffunction-sections \
              -fdata-sections \
              -Wall \
              -MMD \
              -MP \
              --specs=nano.specs \
              -mfpu=fpv4-sp-d16 \
              -mfloat-abi=hard \
              -mthumb \
              -c \
              -o "build/obj/firmware/Core/Src/${name}.o"
          done

      - name: Compile STM32 HAL sources
        run: |
          set -e

          for src in firmware/Drivers/STM32F4xx_HAL_Driver/Src/*.c; do
            name=$(basename "$src" .c)

            arm-none-eabi-gcc "$src" \
              -mcpu=cortex-m4 \
              -std=gnu11 \
              -g3 \
              -DDEBUG \
              -DUSE_HAL_DRIVER \
              -DSTM32F407xx \
              -Icode/inc \
              -Ifirmware/Core/Inc \
              -Ifirmware/Drivers/STM32F4xx_HAL_Driver/Inc \
              -Ifirmware/Drivers/STM32F4xx_HAL_Driver/Inc/Legacy \
              -Ifirmware/Drivers/CMSIS/Device/ST/STM32F4xx/Include \
              -Ifirmware/Drivers/CMSIS/Include \
              -O0 \
              -ffunction-sections \
              -fdata-sections \
              -Wall \
              -MMD \
              -MP \
              --specs=nano.specs \
              -mfpu=fpv4-sp-d16 \
              -mfloat-abi=hard \
              -mthumb \
              -c \
              -o "build/obj/firmware/Drivers/STM32F4xx_HAL_Driver/Src/${name}.o"
          done

      - name: Compile startup code
        run: |
          arm-none-eabi-gcc \
            -mcpu=cortex-m4 \
            -g3 \
            -DDEBUG \
            -DSTM32F407xx \
            -c \
            -x assembler-with-cpp \
            --specs=nano.specs \
            -mfpu=fpv4-sp-d16 \
            -mfloat-abi=hard \
            -mthumb \
            -Ifirmware/Core/Inc \
            -Ifirmware/Drivers/CMSIS/Device/ST/STM32F4xx/Include \
            -Ifirmware/Drivers/CMSIS/Include \
            firmware/Core/Startup/startup_stm32f407vgtx.s \
            -o build/obj/firmware/Core/Startup/startup_stm32f407vgtx.o

      - name: Link firmware
        run: |
          set -e

          arm-none-eabi-gcc \
            -o build/hvac_binary.elf \
            $(find build/obj -name "*.o" -print) \
            -mcpu=cortex-m4 \
            -Tfirmware/STM32F407VGTX_FLASH.ld \
            --specs=nosys.specs \
            --specs=nano.specs \
            -Wl,-Map=build/hvac_binary.map \
            -Wl,--gc-sections \
            -static \
            -mfpu=fpv4-sp-d16 \
            -mfloat-abi=hard \
            -mthumb \
            -Wl,--start-group \
            -lc \
            -lm \
            -Wl,--end-group

      - name: Show firmware size
        run: |
          arm-none-eabi-size build/hvac_binary.elf

      - name: Generate HEX and BIN
        run: |
          arm-none-eabi-objcopy -O ihex \
            build/hvac_binary.elf \
            build/hvac_binary.hex

          arm-none-eabi-objcopy -O binary \
            build/hvac_binary.elf \
            build/hvac_binary.bin

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stm32-firmware
          path: |
            build/hvac_binary.elf
            build/hvac_binary.hex
            build/hvac_binary.bin
            build/hvac_binary.map
