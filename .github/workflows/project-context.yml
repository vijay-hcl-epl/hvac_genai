name: Build Project Context

on:
  workflow_dispatch:
  push:
    paths:
      - "code/src/**"
      - "code/inc/**"
      - "context_builder/**"
      - "context_builder/engines/**"
      - ".github/workflows/project-context.yml"
      - "requirements-context.txt"

permissions:
  contents: write

concurrency:
  group: project-context-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-context:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install LLVM and Clang
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            llvm-14 \
            clang-14 \
            libclang-14-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install libclang==14.0.6

      - name: Verify Clang installation
        run: |
          clang-14 --version
          ls -l /usr/lib/llvm-14/lib/libclang.so

      - name: Build project context
        run: |
          python -m context_builder.context_builder

      - name: Show generated project context
        run: |
          cat context/project_context.json

      - name: Commit & push if changed
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add context/project_context.json

          if git diff --cached --quiet; then
            echo "No project context changes to commit."
            exit 0
          fi

          git commit -m "Update project context [skip ci]"

          git pull --rebase origin "${GITHUB_REF_NAME}"

          git push origin "HEAD:${GITHUB_REF_NAME}" || {
            echo "Push failed due to remote update; rebasing and retrying..."
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          }
